model:
  base_learning_rate: 4.5e-06
  target: taming.models.vqgan.AutoencoderKL
  params:
    modalities:
    - t1
    - t2
    - pd
    embed_dim: 3
    ddconfig:
      double_z: true
      z_channels: 3
      resolution: 256
      in_channels: 1
      out_ch: 1
      ch: 128
      ch_mult:
      - 1
      - 2
      - 4
      num_res_blocks: 2
      attn_resolutions: []
      dropout: 0.0
    lossconfig:
      target: taming.modules.losses.contperceptual.LPIPSWithDiscriminator
      params:
        disc_conditional: false
        disc_in_channels: 1
        disc_start: 10001
        kl_weight: 1.0e-06
        disc_weight: 0.5
data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 1
    num_workers: 8
    train:
      target: taming.data.custom.CustomTrain
      params:
        data_path: ../data/train
        dataset: adni
    validation:
      target: taming.data.custom.CustomTest
      params:
        data_path: ../data/validation
        dataset: adni
    test:
      target: taming.data.custom.CustomTest
      params:
        data_path: ../data/test
        dataset: adni
lightning:
  trainer:
    max_epochs: 1000
