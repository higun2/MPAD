model:
  base_learning_rate: 4.0e-06
  target: ldm.models.diffusion.ddpm.LatentDiffusion
  params:
    linear_start: 0.0015
    linear_end: 0.0195
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    first_stage_key: image
    cond_stage_key: image
    image_size: 32
    channels: 3
    cond_stage_trainable: false
    conditioning_key: None
    monitor: val/loss_simple_ema
    unet_config:
      target: ldm.modules.diffusionmodules.openaimodel.UNetModel
      params:
        image_size: 32
        in_channels: 3
        out_channels: 3
        model_channels: 128
        attention_resolutions:
        - 4
        - 2
        num_res_blocks: 2
        channel_mult:
        - 1
        - 1
        - 2
        num_head_channels: 32
        text_dim: 512
        use_spatial_transformer: false
        transformer_depth: 1
    first_stage_config:
      target: ldm.models.autoencoder.AutoencoderKL
      params:
        modalities:
        - t1
        - t2
        - pd
        ckpt_path: ../checkpoints/autoencoder.ckpt
        embed_dim: 3
        ddconfig:
          double_z: true
          z_channels: 3
          resolution: 256
          in_channels: 1
          out_ch: 1
          ch: 128
          ch_mult:
          - 1
          - 2
          - 4
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity
    cond_stage_config: __is_unconditional__
data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 1
    num_workers: 12
    wrap: false
    train:
      target: ldm.data.custom.CustomTrain
      params:
        data_path: ../data/train
        dataset: adni
    validation:
      target: ldm.data.custom.CustomTest
      params:
        data_path: ../data/validation
        dataset: adni
    test:
      target: ldm.data.custom.CustomTest
      params:
        data_path: ../data/test
        dataset: adni
lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 5000
        max_images: 8
        increase_log_steps: false
  trainer:
    benchmark: true
    max_epochs: 1000
